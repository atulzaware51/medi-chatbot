databases:
  - name: medibot-db
    databaseName: medibot
    user: medibot
    plan: basic-256mb

services:
  - type: web
    name: medibot
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    preDeployCommand: python -m alembic upgrade head
    healthCheckPath: /ready
    disk:
      name: medibot-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: medibot-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: MEDIBOT_COOKIE_SECURE
        value: "true"
      - key: MEDIBOT_ADMIN_LOCAL_DEV
        value: "false"
      - key: MEDIBOT_ADMIN_ALLOW_REMOTE
        value: "false"
      - key: MEDIBOT_RETENTION_DAYS
        value: "30"
      - key: MEDIBOT_CHAT_RATE_LIMIT
        value: "30"
      - key: DATA_DIR
        value: /var/data/raw
      - key: VECTORSTORE_DIR
        value: /var/data/vectorstore/faiss_index
      - key: HF_HOME
        value: /var/data/huggingface
